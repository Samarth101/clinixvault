# ==============================================================================
# ClinixVault Production Multi-Container Orchestration
# Sovereign Edge Clinical Intelligence Platform + Full Observability
# ==============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clinixvault_db
    environment:
      POSTGRES_DB: clinixvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinixvault"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - clinixvault_net

  neo4j:
    image: neo4j:5-community
    container_name: clinixvault_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/clinixvault2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p clinixvault2026 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    networks:
      - clinixvault_net

  gateway:
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.gateway
    container_name: clinixvault_gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/clinixvault
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=clinixvault2026
      - JWT_SECRET_KEY=clinixvault-production-air-gapped-secret-key-32bytes
      - VLM_URL=http://vlm-server:8001
      - LLM_URL=http://llm-server:8002
      - AUDIO_URL=http://audio-server:8003
      - DOCUMENT_URL=http://document-server:8004
      - CORS_ALLOW_ALL=true
      - OLLAMA_HOST=http://host.docker.internal:11434
      - HOST_CHIP=Apple Silicon (M-Series)
      - HOST_ACCELERATOR=Apple Metal (MPS) / Ollama
      - HOST_OS=Darwin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - clinixvault_net

  frontend:
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.frontend
    container_name: clinixvault_frontend
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - clinixvault_net

  alloy:
    image: grafana/alloy:v1.7.5
    container_name: clinixvault_alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    env_file:
      - ./observability/.env
    environment:
      - GATEWAY_METRICS_TARGET=gateway:8000
      - VLM_METRICS_TARGET=gateway:8000
      - LLM_METRICS_TARGET=gateway:8000
      - AUDIO_METRICS_TARGET=gateway:8000
      - DOCUMENT_METRICS_TARGET=gateway:8000
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/clinixvault:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - clinixvault_net

  # --------------------------------------------------------------------------
  # Optional Standalone CPU Microservices (Profile: microservices)
  # Run only if you explicitly want standalone CPU microservice containers:
  # docker compose --profile microservices up -d
  # --------------------------------------------------------------------------
  vlm-server:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.vlm
    container_name: clinixvault_vlm
    ports:
      - "8001:8001"
    environment:
      - VLM_PORT=8001
      - VLM_MODEL_PATH=clinixvault-qwen2vl-qlora
    volumes:
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - clinixvault_net

  llm-server:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.llm
    container_name: clinixvault_llm
    ports:
      - "8002:8002"
    environment:
      - LLM_PORT=8002
      - LLM_MODEL_PATH=/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - clinixvault_net

  audio-server:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.audio
    container_name: clinixvault_audio
    ports:
      - "8003:8003"
    environment:
      - AUDIO_PORT=8003
      - WHISPER_MODEL_SIZE=large-v3-turbo
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - clinixvault_net

  document-server:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: deployment/dockerfiles/Dockerfile.document
    container_name: clinixvault_document
    ports:
      - "8004:8004"
    environment:
      - DOCUMENT_PORT=8004
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - clinixvault_net

volumes:
  postgres_data:
  neo4j_data:

networks:
  clinixvault_net:
    driver: bridge
