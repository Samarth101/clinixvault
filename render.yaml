# Render.com deployment configuration for ClinixVault Gateway (CPU-only showcase mode)
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: clinixvault-backend
    runtime: python
    region: singapore  # closest to India (ap-southeast-1)
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.gateway.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: showcase
      - key: DATABASE_URL
        value: sqlite:///./clinixvault_demo.db
      - key: NEO4J_ENABLED
        value: "false"
      - key: VLM_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "true"
    healthCheckPath: /api/v1/health
