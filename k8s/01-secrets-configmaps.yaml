apiVersion: v1
kind: ConfigMap
metadata:
  name: clinixvault-config
  namespace: clinixvault
data:
  GATEWAY_PORT: "8000"
  VLM_URL: "http://clinixvault-vlm:8001"
  LLM_URL: "http://clinixvault-llm:8002"
  AUDIO_URL: "http://clinixvault-audio:8003"
  DOCUMENT_URL: "http://clinixvault-document:8004"
  NEO4J_URI: "bolt://clinixvault-neo4j:7687"
  NEO4J_USER: "neo4j"
  OLLAMA_URL: "http://127.0.0.1:11434"
  ENVIRONMENT: "kubernetes-production"
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@clinixvault-postgres:5432/clinixvault"
