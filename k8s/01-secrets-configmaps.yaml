  JWT_SECRET_KEY: "clinixvault-production-air-gapped-secret-key-32bytes"
  NEO4J_PASSWORD: "clinixvault2026"
  # Grafana Cloud Ingestion Credentials
  GRAFANA_CLOUD_PROMETHEUS_URL: "https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push"
  GRAFANA_CLOUD_PROMETHEUS_USER: "3688243"
  GRAFANA_CLOUD_LOKI_URL: "https://logs-prod-028.grafana.net/loki/api/v1/push"
  GRAFANA_CLOUD_LOKI_USER: "1839786"
  GRAFANA_CLOUD_API_TOKEN: "your-grafana-cloud-api-token-here"
