# ==============================================================================
# ClinixVault Production Frontend Deployment & Service
# High-performance React SPA served via non-root Nginx with health probing
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-frontend
  namespace: clinixvault
  labels:
    app: clinixvault-frontend
    role: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinixvault-frontend
  template:
    metadata:
      labels:
        app: clinixvault-frontend
    spec:
      containers:
        - name: frontend
          image: clinixvault-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-frontend
  namespace: clinixvault
  labels:
    app: clinixvault-frontend
spec:
  selector:
    app: clinixvault-frontend
  ports:
    - port: 80
      targetPort: 5173
      name: http
