              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-llm
  namespace: clinixvault
spec:
  selector:
    app: clinixvault-llm
