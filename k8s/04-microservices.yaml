# ==============================================================================
# ClinixVault Microservices Fleet Deployments & Services
# VLM Vision (:8001), LLM Summarizer (:8002), Audio ASR (:8003), Document OCR (:8004)
# ==============================================================================

# ----------------- 1. VLM Radiology Service (:8001) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-vlm
  namespace: clinixvault
  labels:
    app: clinixvault-vlm
    role: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinixvault-vlm
  template:
    metadata:
      labels:
        app: clinixvault-vlm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: vlm-server
          image: clinixvault-vlm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: VLM_PORT
              value: "8001"
            - name: VLM_MODEL_PATH
              value: "clinixvault-qwen2vl-qlora"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-vlm
  namespace: clinixvault
spec:
  selector:
    app: clinixvault-vlm
  ports:
    - port: 8001
      targetPort: 8001
      name: http
---
# ----------------- 2. LLM Summarizer Service (:8002) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-llm
  namespace: clinixvault
  labels:
    app: clinixvault-llm
    role: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinixvault-llm
  template:
    metadata:
      labels:
        app: clinixvault-llm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: llm-server
