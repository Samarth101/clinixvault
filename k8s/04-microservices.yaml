    - port: 8002
      targetPort: 8002
      name: http
---
# ----------------- 3. Audio Whisper ASR Service (:8003) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-audio
  namespace: clinixvault
  labels:
    app: clinixvault-audio
    role: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinixvault-audio
  template:
    metadata:
      labels:
        app: clinixvault-audio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: audio-server
          image: clinixvault-audio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: AUDIO_PORT
              value: "8003"
            - name: WHISPER_MODEL_SIZE
              value: "large-v3-turbo"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-audio
  namespace: clinixvault
spec:
  selector:
    app: clinixvault-audio
  ports:
    - port: 8003
      targetPort: 8003
      name: http
---
# ----------------- 4. Document OCR Service (:8004) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-document
  namespace: clinixvault
  labels:
    app: clinixvault-document
    role: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinixvault-document
  template:
    metadata:
      labels:
        app: clinixvault-document
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: document-server
          image: clinixvault-document:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: DOCUMENT_PORT
              value: "8004"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-document
  namespace: clinixvault
spec:
  selector:
    app: clinixvault-document
  ports:
    - port: 8004
      targetPort: 8004
      name: http
