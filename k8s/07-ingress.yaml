# ==============================================================================
# ClinixVault Production Kubernetes Ingress
# Unified routing for React Client, API Gateway, and OpenMetrics
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinixvault-ingress
  namespace: clinixvault
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/websocket-services: "clinixvault-gateway"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  rules:
    - host: clinixvault.local
      http:
        paths:
          # API Gateway Endpoints
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: clinixvault-gateway
                port:
                  number: 8000
          # Prometheus Scraping Endpoint
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: clinixvault-gateway
                port:
                  number: 8000
          # Interactive API Documentation
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: clinixvault-gateway
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: clinixvault-gateway
                port:
                  number: 8000
          # Frontend Client (Default fallback)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinixvault-frontend
                port:
                  number: 80
