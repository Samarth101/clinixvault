# ==============================================================================
# ClinixVault API Gateway Deployment & Service
# Core orchestration, authentication, telemetry ingestion, and OpenMetrics endpoint
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-gateway
  namespace: clinixvault
  labels:
    app: clinixvault-gateway
    role: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinixvault-gateway
  template:
    metadata:
      labels:
        app: clinixvault-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: clinixvault-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: clinixvault-config
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clinixvault-secrets
                  key: JWT_SECRET_KEY
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinixvault-secrets
                  key: NEO4J_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: clinixvault-gateway
  namespace: clinixvault
spec:
  selector:
    app: clinixvault-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http
