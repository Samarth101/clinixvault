services:
  vlm-server:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.vlm
    container_name: clinixvault_vlm_cloud
    ports:
      - "8001:8001"
    environment:
      - VLM_PORT=8001
      - VLM_MODEL_PATH=clinixvault-qwen2vl-qlora
      - VLM_QUANTIZATION=awq
      - DEPLOYMENT_ENVIRONMENT=cloud
    volumes:
      - ../models:/app/models
      - ../checkpoints:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  llm-server:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.llm
    container_name: clinixvault_llm_cloud
    ports:
      - "8002:8002"
    environment:
      - LLM_PORT=8002
      - LLM_MODEL_PATH=/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
      - LLM_N_GPU_LAYERS=33
      - DEPLOYMENT_ENVIRONMENT=cloud
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  audio-server:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.audio
    container_name: clinixvault_audio_cloud
    ports:
      - "8003:8003"
    environment:
      - AUDIO_PORT=8003
      - WHISPER_MODEL_SIZE=large-v3
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - DEPLOYMENT_ENVIRONMENT=cloud
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  document-server:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.document
    container_name: clinixvault_document_cloud
    ports:
      - "8004:8004"
    environment:
      - DOCUMENT_PORT=8004
      - DEPLOYMENT_ENVIRONMENT=cloud
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  gateway:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.gateway
    container_name: clinixvault_gateway_cloud
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - DATABASE_URL=${CLOUD_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@rds.internal:5432/clinixvault}
      - VLM_URL=http://vlm-server:8001
      - LLM_URL=http://llm-server:8002
      - AUDIO_URL=http://audio-server:8003
      - DOCUMENT_URL=http://document-server:8004
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-clinixvault-cloud-secure-secret-key-prod-32bytes}
      - NEO4J_URI=${CLOUD_NEO4J_URI:-bolt://neo4j.internal:7687}
      - NEO4J_USER=${CLOUD_NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${CLOUD_NEO4J_PASSWORD:-clinixvault2026}
      - DEPLOYMENT_ENVIRONMENT=cloud
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: deployment/dockerfiles/Dockerfile.frontend
    container_name: clinixvault_frontend_cloud
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: always
