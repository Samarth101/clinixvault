apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clinixvault-edge-service
  namespace: default
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/cloudsql-instances: "my-gcp-project:us-central1:clinixvault-pgvector"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/my-gcp-project/clinixvault-gateway:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "4000m"
              memory: "8Gi"
          env:
            - name: GATEWAY_PORT
              value: "8000"
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:secret@/clinixvault?host=/cloudsql/my-gcp-project:us-central1:clinixvault-pgvector"
            - name: VLM_URL
              value: "http://localhost:8001"
            - name: LLM_URL
              value: "http://localhost:8002"
