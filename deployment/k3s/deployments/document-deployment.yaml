apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-document
  namespace: clinixvault
  labels:
    app: clinixvault-document
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinixvault-document
  template:
    metadata:
      labels:
        app: clinixvault-document
    spec:
      containers:
        - name: document
          image: clinixvault/document:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: DOCUMENT_PORT
              value: "8004"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
