apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinixvault-gateway
  namespace: clinixvault
  labels:
    app: clinixvault-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinixvault-gateway
  template:
    metadata:
      labels:
        app: clinixvault-gateway
    spec:
      containers:
        - name: gateway
          image: clinixvault/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GATEWAY_PORT
              value: "8000"
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:postgres@clinixvault-db:5432/clinixvault"
            - name: VLM_URL
              value: "http://clinixvault-vlm:8001"
            - name: LLM_URL
              value: "http://clinixvault-llm:8002"
            - name: AUDIO_URL
              value: "http://clinixvault-audio:8003"
            - name: DOCUMENT_URL
              value: "http://clinixvault-document:8004"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
