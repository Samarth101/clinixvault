<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 240 240" width="210" height="210" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="vaultArmor1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="50%" stop-color="#1e40af"/>
                <stop offset="100%" stop-color="#0f172a"/>
              </linearGradient>
              <linearGradient id="clinicalCore1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
              <radialGradient id="aiPulse1" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#a7f3d0"/>
                <stop offset="45%" stop-color="#10b981"/>
                <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- 1. OUTER ZERO-EGRESS VAULT PERIMETER (Heavy Sealed Hexagon) -->
            <polygon points="120,14 212,67 212,173 120,226 28,173 28,67" fill="none" stroke="url(#vaultArmor1)" stroke-width="14" stroke-linejoin="round"/>

            <!-- Inward-Locking Zero-Egress Bolts (Showing data cannot exit) -->
            <line x1="120" y1="21" x2="120" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="120" y1="219" x2="120" y2="205" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
            <line x1="34" y1="70" x2="46" y2="77" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="206" y1="170" x2="194" y2="163" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
            <line x1="206" y1="70" x2="194" y2="77" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <line x1="34" y1="170" x2="46" y2="163" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>

            <!-- 2. THE AIR-GAP (Explicit Unbroken Dark Void Moat + Dashed Isolation Boundary) -->
            <polygon points="120,42 188,81 188,159 120,198 52,159 52,81" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.45"/>

            <!-- 3. INNER CLINICAL CROSS SANCTUARY (Medical Care + Appliance Chassis) -->
            <path d="M98,62 H142 V98 H178 V142 H142 V178 H98 V142 H62 V98 H98 Z" fill="#0b1524" stroke="url(#clinicalCore1)" stroke-width="5" stroke-linejoin="round"/>

            <!-- 4. ENCAPSULATED NEURAL AI CORE (Self-Contained Compute Graph) -->
            <g filter="url(#glow1)">
              <!-- Internal Neural Connections (Strictly Contained Inside Cross) -->
              <line x1="120" y1="80" x2="120" y2="160" stroke="#2dd4bf" stroke-width="2" opacity="0.75"/>
              <line x1="80" y1="120" x2="160" y2="120" stroke="#2dd4bf" stroke-width="2" opacity="0.75"/>
              <line x1="120" y1="80" x2="80" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.55"/>
              <line x1="120" y1="80" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.55"/>
              <line x1="120" y1="160" x2="80" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.55"/>
              <line x1="120" y1="160" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.55"/>

              <!-- Outer Synapse Nodes -->
              <circle cx="120" cy="80" r="5" fill="#00f2fe"/>
              <circle cx="120" cy="160" r="5" fill="#00f2fe"/>
              <circle cx="80" cy="120" r="5" fill="#00f2fe"/>
              <circle cx="160" cy="120" r="5" fill="#00f2fe"/>

              <!-- Central Singularity AI Brain -->
              <circle cx="120" cy="120" r="22" fill="url(#aiPulse1)"/>
              <circle cx="120" cy="120" r="9" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
            </g>
          </svg>