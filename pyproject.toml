[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinixvault"
version = "1.0.0"
description = "Air-gapped edge AI clinical appliance for radiology report generation, ambient medical scribing, and record synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ClinixVault Engineering Team", email = "engineering@clinixvault.internal"}
]
keywords = ["radiology", "clinical-nlp", "edge-ai", "fhir", "vlm", "whisper", "ambient-scribe"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "pypdf>=4.0.0",
    "websockets>=12.0",
    "pydicom>=2.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "locust>=2.24.0",
    "ruff>=0.3.0",
    "black>=24.2.0"
]
inference = [
    "llama-cpp-python>=0.2.75",
    "faster-whisper>=1.0.1",
    "pyannote.audio>=3.1.1",
    "PyMuPDF>=1.23.26",
    "pytesseract>=0.3.10",
    "outlines>=0.0.34"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -W ignore::DeprecationWarning"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"
