name: ClinixVault CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-python:
    name: Backend Pytest & Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev tesseract-ocr ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov bandit flake8

      - name: Run Python Static Security Analysis (Bandit)
        run: |
          bandit -r backend/ inference/shared/ -ll -ii || true

      - name: Run Pytest Unit & Integration Tests
        run: |
          python3 -m pytest tests/unit -v --durations=10

  build-frontend:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: TypeScript Typecheck & Production Vite Build
        working-directory: frontend
        run: |
          npm run build

  validate-docker:
    name: Docker Compose & K3s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Edge Docker Compose Configuration
        run: |
          docker compose -f deployment/docker-compose.yml config

      - name: Validate Cloud Docker Compose Configuration
        run: |
          docker compose -f deployment/docker-compose.cloud.yml config

      - name: Validate Kubernetes / K3s YAML Manifests
        run: |
          python3 -c "
          import yaml, glob
          for f in glob.glob('deployment/k3s/**/*.yaml', recursive=True):
              with open(f) as stream:
                  list(yaml.safe_load_all(stream))
                  print(f'Valid YAML: {f}')
          "
